name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  # Allows the release-please workflow to run CI on the release PR branch:
  # pushes made with GITHUB_TOKEN do not trigger workflows, but dispatches do.
  workflow_dispatch: {}

jobs:
  test:
    if: github.ref_type == 'branch' && github.ref_name != 'main'
    uses: ./.github/workflows/test.yml

  code_quality:
    if: github.ref_type == 'branch' && github.ref_name != 'main'
    uses: ./.github/workflows/code_quality.yml

  build_publish:
    uses: ./.github/workflows/build_publish.yml
